<!DOCTYPE html>
<html lang="pl" data-theme="ocean">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Brak połączenia — PTScheduler</title>
    <style>
        :root {
            --c-primary: #0284C7;
            --c-bg: #f8fafc;
            --c-text: #1e293b;
            --c-muted: #94a3b8;
        }
        @media (prefers-color-scheme: dark) {
            :root {
                --c-bg: #0f172a;
                --c-text: #f1f5f9;
                --c-muted: #64748b;
            }
        }
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--c-bg);
            color: var(--c-text);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 2rem;
            text-align: center;
        }
        .icon-wrap {
            position: relative;
            margin-bottom: 1.5rem;
        }
        .icon-bg {
            font-size: 6rem;
            line-height: 1;
            opacity: 0.12;
            color: var(--c-primary);
            display: block;
        }
        .icon-badge {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -55%);
            font-size: 2rem;
        }
        h1 {
            font-size: 1.5rem;
            font-weight: 800;
            margin-bottom: 0.5rem;
            letter-spacing: -0.03em;
        }
        p {
            color: var(--c-muted);
            font-size: 1rem;
            max-width: 360px;
            margin: 0 auto 0.5rem;
            line-height: 1.5;
        }
        p.small { font-size: 0.875rem; }
        .btn {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            margin-top: 1.5rem;
            padding: 0.625rem 1.5rem;
            border-radius: 0.5rem;
            font-size: 0.95rem;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: var(--c-primary);
            color: #fff;
            text-decoration: none;
        }
        .btn:hover { opacity: 0.88; }
        .tip {
            margin-top: 3rem;
            font-size: 0.7rem;
            opacity: 0.4;
            color: var(--c-muted);
        }
    </style>
</head>
<body>
    <div class="icon-wrap">
        <span class="icon-bg">&#128246;</span>
        <span class="icon-badge">&#128683;</span>
    </div>

    <h1>Brak połączenia z siecią</h1>

    <p>Aplikacja działa offline, ale ta strona wymaga internetu.</p>
    <p class="small">Sprawdź Wi-Fi lub dane mobilne, a potem spróbuj ponownie.</p>

    <button class="btn" onclick="location.reload()">
        &#8635; Odśwież
    </button>

    <p class="tip">Pro tip: trening możesz zaplanować z głowy, ale zapisać dopiero z połączeniem.</p>
</body>
</html>
