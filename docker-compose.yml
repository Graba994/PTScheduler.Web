services:

  db:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ptscheduler
      POSTGRES_USER:     ptscheduler
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptscheduler -d ptscheduler"]
      interval: 5s
      timeout: 5s
      retries: 10

  web:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=ptscheduler;
        Username=ptscheduler;Password=${DB_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    volumes:
      # Persist uploaded files (logos, profile pictures)
      - uploads:/app/wwwroot/uploads

volumes:
  pgdata:
  uploads:
