# Wariant dla Unraid, gdy Postgres działa już jako osobny kontener/VM na Twoim serwerze
# (zamiast bazy uruchamianej przez docker-compose.yml). Wszystkie dane wrażliwe idą
# przez .env — skopiuj .env.unraid.example jako .env i uzupełnij wartości:
#   cp .env.unraid.example .env
#
# WAŻNE — pierwsze uruchomienie: aplikacja zakłada domyślne konto administratora
# root@admin.local / password (seedowane automatycznie, gdy baza jest pusta).
# Zaloguj się i ZMIEŃ to hasło natychmiast, zanim wystawisz appkę publicznie.
services:

  web:
    build: .
    image: ptscheduler-web
    container_name: PTScheduler
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8080}:8080"
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=${DB_HOST:?DB_HOST is required};Port=${DB_PORT:-5432};Database=${DB_NAME:-ptscheduler};
        Username=${DB_USER:?DB_USER is required};Password=${DB_PASSWORD:?DB_PASSWORD is required}
    volumes:
      - /mnt/user/appdata/ptscheduler/branding:/app/wwwroot/branding
