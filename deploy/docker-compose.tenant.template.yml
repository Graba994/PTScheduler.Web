# Auto-generated by provision.sh — do not edit manually.
# Tenant: {{TENANT_SLUG}}
# Domain: {{TENANT_DOMAIN}}

services:

  db:
    image: postgres:17-alpine
    container_name: pt-{{TENANT_SLUG}}-db
    restart: unless-stopped
    environment:
      POSTGRES_DB:       ptscheduler
      POSTGRES_USER:     ptscheduler
      POSTGRES_PASSWORD: {{DB_PASSWORD}}
    volumes:
      - pgdata:/var/lib/postgresql/data
    # Limity jak w instancjach zakładanych przez Portal — trener nie zabiera zasobów innym.
    mem_limit: 512m
    memswap_limit: 512m
    cpus: 1.0
    pids_limit: 256
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ptscheduler -d ptscheduler"]
      interval: 5s
      timeout: 5s
      retries: 10
    networks:
      - internal

  web:
    image: ptscheduler-web:latest
    container_name: pt-{{TENANT_SLUG}}-web
    restart: unless-stopped
    ports:
      - "{{APP_PORT}}:8080"
    environment:
      ConnectionStrings__DefaultConnection: >-
        Host=db;Port=5432;Database=ptscheduler;
        Username=ptscheduler;Password={{DB_PASSWORD}}
      ASPNETCORE_ENVIRONMENT: Production
      TENANT_SLUG: "{{TENANT_SLUG}}"
      TENANT_DOMAIN: "{{TENANT_DOMAIN}}"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - branding:/app/wwwroot/branding
    mem_limit: 1024m
    memswap_limit: 1024m
    cpus: 2.0
    pids_limit: 512
    networks:
      - internal
      - proxy

volumes:
  pgdata:
  branding:

networks:
  internal:
    driver: bridge
  proxy:
    external: true
    name: deploy_default
