# Shared infrastructure — Nginx Proxy Manager + image builder
# Start once: docker compose -f docker-compose.infra.yml up -d
#
# NPM dashboard: http://YOUR_SERVER_IP:81
# Default login:  admin@example.com / changeme

services:

  npm:
    image: jc21/nginx-proxy-manager:latest
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "81:81"        # NPM admin panel
    volumes:
      - npm_data:/data
      - npm_letsencrypt:/etc/letsencrypt
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:81/api/"]
      interval: 30s
      timeout: 10s
      retries: 5

volumes:
  npm_data:
  npm_letsencrypt:
